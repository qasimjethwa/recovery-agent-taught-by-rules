# LoRA SFT configuration — Lexsi Track 3 (Agentic Fine-tuning) entry.
# Consumed by train_lora.py. Values marked IN-WINDOW are set during the
# hackathon build window (Nov 1–14, 2026), not before.

base_model: "CohereLabs/aya-expanse-8b"   # Aya Expanse 8B, Cohere Labs open weights
                                          # (confirm exact HF repo id at run time)
train_file: "../data/train.jsonl"
eval_file: "../data/eval.jsonl"

# LoRA (AgentTune-style supervised post-training for reliable tool use)
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  task_type: "CAUSAL_LM"

training:
  num_epochs: 3
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  max_seq_length: 1024
  logging_steps: 10
  save_strategy: "epoch"
  bf16: true

output:
  local_dir: "./output/aya-expanse-8b-recovery-lora"
  # IN-WINDOW: Hugging Face repos for the submitted artifacts, e.g.
  #   adapter_repo: "<hf-username>/aya-expanse-8b-recovery-lora"
  #   dataset_repo: "<hf-username>/recovery-copilot-toolcalls"
  adapter_repo: null
  dataset_repo: null

# IN-WINDOW ONLY: authenticate before any run —
#   export HF_TOKEN=<your Hugging Face token>   (never commit the token)
# The base model is gated; accept its licence on Hugging Face first.
